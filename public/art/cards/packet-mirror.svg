<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#1b1004"/>
    <stop offset="0.52" stop-color="#422604"/>
    <stop offset="1" stop-color="#1b1004"/>
  </linearGradient>
  <radialGradient id="halo" cx="50%" cy="43%" r="58%">
